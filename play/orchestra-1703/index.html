<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кто ты из мира музыки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;700&family=Rubik+Mono+One&display=swap">
<style>
  :root {
    --green: #1D3028;
    --coral: #EC635D;
    --mustard: #F4BE68;
    --cream: #EFE8E1;
    --paper: #E2D6C8;
    --f-display: "Despair Display", "Arial Black", Impact, sans-serif;
    --f-bold: "Steppe Bold", "Arial Black", Arial, sans-serif;
    --f-book: "Steppe Book", Arial, sans-serif;
    --f-deco: "DRUZHOK", "Arial Black", sans-serif;
    --edge: 4px;
    --shadow: 10px;
  }

  @font-face {
    font-family: 'Steppe';
    src: url('fonts/Steppe-Regular.ttf') format('truetype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: 'Steppe';
    src: url('fonts/Steppe-SemiBold.ttf') format('truetype');
    font-weight: 600;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: 'DRUZHOK';
    src: url('./fonts/DRUZHOK.woff') format('opentype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: 'Despair Display';
    src: url('./fonts/DespairDisplay-Bold.woff') format('opentype');
    font-weight: 700;
    font-style: normal;
  }

  * {
    box-sizing: border-box
  }

  html,
  body {
    height: 100%;
    margin: 0
  }

  body {
    background: var(--cream);
    color: var(--green);
    font-family: var(--f-book);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased
  }

  #root {
    height: 100%
  }

  button {
    font: inherit;
    color: inherit;
    cursor: pointer
  }

  a {
    color: inherit
  }

  :focus-visible {
    outline: 4px solid var(--coral);
    outline-offset: 4px
  }

  svg {
    overflow: visible
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap
  }

  .shd {
    filter: drop-shadow(var(--shadow) var(--shadow) 0 var(--green))
  }

  .shd.sm {
    filter: drop-shadow(6px 6px 0 var(--green))
  }

  .app {
    position: relative;
    height: 100%;
    min-height: 640px;
    overflow: hidden;
    background: var(--cream)
  }


  .app::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 50;
    opacity: .5;
    mix-blend-mode: multiply;
    background-image: radial-gradient(rgba(29, 48, 40, .09) 1px, transparent 1.2px);
    background-size: 5px 5px
  }

  .hero {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    overflow-x: clip
  }

  .stage {
    position: absolute;
    inset: 0
  }

  .px,
  .px * {
    pointer-events: none
  }

  .px {
    position: absolute;
    inset: 0;
    transform: translate3d(var(--mx, 0px), var(--my, 0px), 0)
  }

  .in {
    position: absolute;
    opacity: 0;
    animation: slide 1s cubic-bezier(.2, .9, .25, 1.05) forwards;
    animation-delay: var(--d, 0s)
  }

  .in.flow {
    position: relative
  }

  @keyframes slide {
    from {
      opacity: 0;
      transform: translate3d(var(--fx, 0), var(--fy, 0), 0) rotate(var(--fr, 0deg))
    }

    to {
      opacity: 1;
      transform: var(--rest, none)
    }
  }

  .staff {
    left: 0;
    width: 100%;
    top: 14%;
    height: 34%
  }

  .staff svg {
    opacity: .55
  }

  .disc {
    width: 34vw;
    height: 34vw;
    max-width: 560px;
    max-height: 560px;
    border-radius: 50%;
    background: var(--mustard);
    border: var(--edge) solid var(--green);
    box-shadow: var(--shadow) var(--shadow) 0 var(--green)
  }

  .disc.d1 {
    left: -6vw;
    bottom: -14vw;
    --fy: 40vh
  }

  .board {
    left: 37vw;
    top: 5vh;
    width: 15vw;
    min-width: 150px;
    --fx: -40vw
  }

  .star {
    right: 27vw;
    top: 9vh;
    width: 9vw;
    min-width: 90px;
    --fy: -50vh;
    --fr: -90deg
  }

  .silhouette {
    right: -2vw;
    bottom: -3vh;
    height: 96vh;
    width: auto;
    aspect-ratio: 3/4;
    --fx: 60vw
  }

  .note-a {
    right: 3vw;
    top: 6vh;
    width: 11vw;
    min-width: 100px;
    --fy: -40vh;
    --fr: 20deg
  }

  .note-b {
    left: 36vw;
    bottom: 5vh;
    width: 8vw;
    min-width: 80px;
    --fy: 40vh;
    --fr: -30deg
  }

  .arrow {
    left: 20vw;
    bottom: 8vh;
    width: 7vw;
    min-width: 70px;
    --fx: -30vw
  }

  .dice {
    right: 36vw;
    bottom: 4vh;
    width: 7vw;
    min-width: 70px;
    --fy: 50vh;
    --fr: 60deg
  }

  .slot {
    left: 45vw;
    bottom: 4vh;
    width: 12vw;
    min-width: 140px;
    padding: 10px 12px;
    border: 3px dashed var(--green);
    font: 700 11px/1.3 var(--f-bold);
    letter-spacing: .06em;
    text-transform: uppercase;
    background: rgba(244, 190, 104, .35);
    transform: rotate(-3deg);
    --rest: rotate(-3deg)
  }

  .copy {
    position: absolute;
    left: 5vw;
    top: 15vh;
    z-index: 10;
    width: 62vw;
    max-width: 980px
  }

  .eyebrow {
    font: 700 clamp(10px, .9vw, 13px)/1 var(--f-bold);
    letter-spacing: .14em;
    text-transform: uppercase;
    display: inline-block;
    background: var(--green);
    color: var(--cream);
    padding: .7em 1em;
    transform: rotate(-2deg);
    --rest: rotate(-2deg)
  }

  .title {
    margin: 2.2vh 0 0;
    font: 400 clamp(44px, 8.6vw, 150px)/.86 var(--f-display);
    letter-spacing: -.01em;
    text-transform: uppercase
  }

  .title .ln {
    display: block;
    width: max-content;
    max-width: 100%
  }

  .title .ln>span {
    display: inline-block
  }

  .title .l1 {
    transform: rotate(-1.5deg);
    --rest: rotate(-1.5deg)
  }

  .title .l2 {
    margin-left: 9vw;
    color: var(--coral);
    -webkit-text-stroke: var(--edge) var(--green);
    paint-order: stroke fill;
    text-shadow: 7px 7px 0 var(--green)
  }

  .title .l3 {
    margin-left: 2vw
  }

  .title .l3 em {
    font-style: normal;
    background: var(--mustard);
    padding: 0 .12em;
    border: var(--edge) solid var(--green);
    box-shadow: 8px 8px 0 var(--green);
    display: inline-block;
    transform: rotate(2deg)
  }

  .sub {
    margin: 4vh 0 0 2vw;
    font: 700 clamp(15px, 1.7vw, 26px)/1.2 var(--f-bold);
    max-width: 22ch;
    --fy: 30vh
  }

  .sub s {
    text-decoration-thickness: 4px;
    text-decoration-color: var(--coral)
  }

  .cta-wrap {
    position: absolute;
    left: 8vw;
    bottom: 5vh;
    top: auto;
    z-index: 12;
    --fy: 60vh;
  }

  .footnote {
    position: absolute;
    left: 5vw;
    bottom: 2vh;
    z-index: 13;
    max-width: min(46ch, 60vw);
    margin: 0;
    padding: 6px 10px;
    background: var(--cream);
    border-left: 4px solid var(--coral);
    font: 500 11px/1.35 var(--f-book)
  }

  .btn {
    position: relative;
    display: inline-block;
    border: 0;
    background: none;
    padding: 0;
    margin: 0;
    text-decoration: none;
    color: inherit
  }

  .btn .face {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
    background: var(--coral);
    color: var(--cream);
    border: var(--edge) solid var(--green);
    border-radius: 28px;
    padding: .75em 1.5em;
    font: 800 clamp(20px, 2.4vw, 38px)/1 var(--f-bold);
    letter-spacing: .03em;
    transform: translate(0, 0);
    transition: transform .09s ease-out
  }

  .btn::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--green);
    border-radius: 30px;
    transform: translate(var(--shadow), var(--shadow))
  }

  .btn:hover .face {
    transform: translate(-3px, -3px)
  }

  .btn:active .face,
  .btn.pressed .face {
    transform: translate(var(--shadow), var(--shadow));
    transition-duration: .05s
  }

  @media (hover:none) {
    .btn:hover .face {
      transform: none
    }
  }

  .btn.ghost .face {
    background: var(--cream);
    color: var(--green)
  }

  .btn.small .face {
    min-height: 46px;
    font-size: clamp(14px, 1.3vw, 18px);
    padding: .6em 1.2em;
    border-radius: 20px
  }

  .btn.small::before {
    border-radius: 22px
  }


  .btn[disabled] {
    cursor: not-allowed
  }

  .btn[disabled] .face {
    transform: none;
    background: var(--cream);
    color: rgba(29, 48, 40, .6);
    border: var(--edge) dashed rgba(29, 48, 40, .55)
  }

  .btn[disabled]::before {
    background: rgba(29, 48, 40, .2)
  }


  .curtain {
    position: absolute;
    inset: 0;
    z-index: 40;
    pointer-events: none;
    display: flex
  }

  .curtain .half {
    position: relative;
    flex: 1;
    border: var(--edge) solid var(--green);
    transform: translateX(var(--from));
    transition: transform .55s cubic-bezier(.7, 0, .2, 1)
  }

  .curtain .left {
    --from: calc(-100% - 24px);
    background: var(--coral);
    box-shadow: 12px 0 0 var(--green)
  }

  .curtain .right {
    --from: calc(100% + 24px);
    background: var(--mustard);
    box-shadow: -12px 0 0 var(--green)
  }

  .curtain.closed .half {
    transform: none
  }

  .curtain svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%
  }

  .quiz {
    position: absolute;
    inset: 0;
    z-index: 5;
    overflow-y: auto;
    overflow-x: clip;
    display: grid;
    grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
    grid-template-rows: 1fr auto;
    column-gap: 4vw;
    row-gap: 2.5vh;
    padding: 5vh 5vw 4vh
  }

  .quiz .deco,
  .result .deco {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden
  }

  .q-left {
    position: relative;
    z-index: 2;
    align-self: center;
    display: flex;
    flex-direction: column;
    gap: 3vh;
    min-width: 0
  }

  .q-right {
    position: relative;
    z-index: 2;
    align-self: center;
    display: flex;
    flex-direction: column;
    gap: 3vh;
    min-width: 0
  }

  .prog {
    display: flex;
    align-items: center;
    gap: 14px;
    font: 800 clamp(12px, 1.1vw, 16px)/1 var(--f-bold);
    letter-spacing: .08em
  }

  .prog .bars {
    display: flex;
    gap: 6px;
    flex: 1;
    max-width: 300px
  }

  .prog .bars i {
    flex: 1;
    height: 16px;
    border: 3px solid var(--green);
    background: var(--cream);
    transform: skewX(-12deg)
  }

  .prog .bars i.on {
    background: var(--coral);
    box-shadow: 3px 3px 0 var(--green)
  }

  .q-title {
    margin: 0;
    font: 400 clamp(24px, 2.6vw, 42px)/1 var(--f-display);
    text-transform: uppercase;
    overflow-wrap: break-word
  }

  .q-title:focus {
    outline: none
  }

  .scene-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    transform: rotate(-1.2deg)
  }

  .scene {
    display: block;
    width: 100%;
    height: auto;
    max-height: min(40vh, 340px)
  }

  .answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    margin: 0;
    padding: 0;
    border: 0;
    min-width: 0
  }

  .answers legend {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0)
  }

  .ans {
    position: relative;
    display: block
  }

  .ans input {
    position: absolute;
    opacity: 0;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    cursor: pointer;
    z-index: 3
  }

  .ans .card {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 14px;
    min-height: clamp(120px, 17vh, 180px);
    padding: 18px 20px;
    border: var(--edge) solid var(--green);
    border-radius: 26px;
    background: var(--bg);
    color: var(--fg);
    box-shadow: var(--shadow) var(--shadow) 0 var(--green);
    transition: transform .12s ease-out, box-shadow .12s ease-out
  }

  .ans .tag {
    font: 800 13px/1 var(--f-bold);
    letter-spacing: .12em
  }

  .ans .txt {
    font: 700 clamp(13px, 1.05vw, 16px)/1.3 var(--f-bold)
  }

  .ans .txt small {
    display: block;
    margin-top: 8px;
    font: 500 clamp(12px, 1vw, 14px)/1.35 var(--f-book);
    opacity: .88;
    text-transform: none
  }

  .ans:nth-child(1) {
    --bg: var(--mustard);
    --fg: var(--green)
  }

  .ans:nth-child(2) {
    --bg: #ECE3DA;
    --fg: var(--green)
  }

  .ans:nth-child(3) {
    --bg: var(--coral);
    --fg: var(--cream)
  }

  .ans:nth-child(4) {
    --bg: var(--green);
    --fg: var(--cream)
  }

  .ans:nth-child(odd) .card {
    transform: rotate(-.6deg)
  }

  .ans:nth-child(even) .card {
    transform: rotate(.5deg)
  }

  .ans:hover .card {
    transform: translate(-3px, -3px) rotate(0);
    box-shadow: calc(var(--shadow) + 3px) calc(var(--shadow) + 3px) 0 var(--green)
  }

  @media (hover:none) {
    .ans:hover .card {
      transform: none;
      box-shadow: var(--shadow) var(--shadow) 0 var(--green)
    }
  }

  .ans input:focus-visible+.card {
    outline: 4px solid var(--coral);
    outline-offset: 5px
  }

  .ans input:checked+.card {
    transform: translate(var(--shadow), var(--shadow));
    box-shadow: 0 0 0 var(--green);
    outline: 5px solid var(--green);
    outline-offset: 3px
  }

  .ans input:checked+.card .tag::after {
    content: " ✓ ВЫБРАНО"
  }

  .q-foot {
    position: relative;
    z-index: 6;
    grid-column: 1/-1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px
  }

  .q-foot .msg {
    font: 500 14px/1.3 var(--f-book)
  }

  @keyframes rise {
    from {
      opacity: 0;
      transform: translateY(24px)
    }

    to {
      opacity: 1;
      transform: none
    }
  }

  .quiz.enter .q-left>*,
  .quiz.enter .ans {
    animation: rise .55s cubic-bezier(.2, .9, .25, 1) both
  }

  .quiz.enter .ans {
    animation-delay: calc(.08s * var(--i, 0) + .1s)
  }

  .rise {
    animation: rise .6s cubic-bezier(.2, .9, .25, 1) both;
    animation-delay: var(--d, 0s)
  }

  @keyframes scene-in {
    from {
      opacity: 0;
      transform: translateY(26px) rotate(-3.5deg)
    }

    60% {
      opacity: 1;
      transform: translateY(-3px) rotate(.6deg)
    }

    to {
      opacity: 1;
      transform: none
    }
  }

  .quiz.enter .q-left>.scene-wrap {
    animation: scene-in .45s cubic-bezier(.2, .8, .3, 1) .3s both
  }

  .quiz.enter.after-sweep .q-left>.scene-wrap {
    animation-delay: .55s
  }

  .music-slot {
    min-height: clamp(168px, 22vh, 214px)
  }


  .music-card {
    position: relative;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 16px 22px;
    align-items: start;
    padding: 16px 20px 16px 16px;
    background: var(--cream);
    border: var(--edge) solid var(--green);
    border-radius: 24px;
    box-shadow: 8px 8px 0 var(--green);
    transform: rotate(.5deg);
    scroll-margin-bottom: 110px;
    animation: slip .5s cubic-bezier(.2, .9, .25, 1.05) both
  }

  @keyframes slip {
    from {
      opacity: 0;
      transform: translateY(28px) rotate(-3deg)
    }

    to {
      opacity: 1;
      transform: rotate(.5deg)
    }
  }

  .mc-ico {
    width: 64px;
    flex: none;
    margin-top: 4px
  }

  .mc-ico svg {
    display: block;
    width: 100%;
    height: auto
  }

  .mc-body {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: flex-start
  }

  .mc-label {
    display: inline-block;
    background: var(--coral);
    color: var(--cream);
    font: 800 10px/1 var(--f-bold);
    letter-spacing: .14em;
    text-transform: uppercase;
    padding: .6em .8em;
    transform: rotate(-1.5deg)
  }

  .mc-lead {
    margin: 2px 0 0;
    font: 500 clamp(13px, 1.1vw, 15px)/1.4 var(--f-book)
  }

  .mc-work {
    margin: 0;
    font: 800 clamp(13px, 1.1vw, 15px)/1.25 var(--f-bold);
    overflow-wrap: anywhere
  }

  .mc-comp {
    display: block;
    margin-top: 3px;
    font: 700 12px/1.3 var(--f-book);
    opacity: .85
  }

  .mc-why {
    margin: 0;
    font: 500 clamp(12px, 1vw, 14px)/1.4 var(--f-book)
  }

  .mc-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 18px;
    margin-top: 6px
  }

  .mc-actions .btn {
    margin-right: 10px;
    margin-bottom: 10px
  }

  .mc-src {
    font: 500 11px/1.3 var(--f-book);
    opacity: .75;
    max-width: 30ch
  }

  .mc-note {
    margin: 4px 0 0;
    font: 500 12px/1.4 var(--f-book);
    opacity: .8
  }

  .music-card.is-result {
    background: var(--mustard);
    transform: rotate(-.6deg);
    animation: none
  }

  .music-card.is-result .mc-label {
    background: var(--green)
  }

  .music-card.is-result .mc-lead,
  .music-card.is-result .mc-why {
    font-size: clamp(14px, 1.2vw, 17px)
  }

  .music-card.is-result .mc-work {
    font-size: clamp(15px, 1.3vw, 19px)
  }

  .music-card.is-result .mc-ico {
    width: 78px
  }

  .sweep {
    position: absolute;
    left: 0;
    right: 0;
    top: 30%;
    height: 40%;
    z-index: 30;
    pointer-events: none;
    background: var(--cream);
    border-block: var(--edge) solid var(--green);
    transform: scaleY(0);
    transform-origin: center;
    transition: transform .3s cubic-bezier(.7, 0, .3, 1)
  }

  .sweep.on {
    transform: scaleY(1)
  }

  .sweep svg {
    width: 100%;
    height: 100%;
    display: block
  }

  .sweep .lines path {
    stroke-dasharray: 1600;
    stroke-dashoffset: 1600
  }

  .sweep.on .lines path {
    animation: draw .55s .2s ease-out forwards
  }

  .sweep .nt {
    opacity: 0;
    transform: translateX(-80px)
  }

  .sweep.on .nt {
    animation: hop .7s calc(.07s*var(--i)) cubic-bezier(.2, .9, .3, 1.2) forwards
  }

  @keyframes draw {
    to {
      stroke-dashoffset: 0
    }
  }

  @keyframes hop {
    0% {
      opacity: 0;
      transform: translate(-80px, 20px)
    }

    40% {
      opacity: 1
    }

    100% {
      opacity: 1;
      transform: translate(0, 0)
    }
  }

  .result {
    position: absolute;
    inset: 0;
    z-index: 5;
    overflow-y: auto;
    overflow-x: clip;
    display: grid;
    grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
    column-gap: 4vw;
    align-items: start;
    padding: 5vh 6vw 6vh
  }

  .poster-wrap {
    position: sticky;
    top: 5vh;
    z-index: 2;
    display: flex;
    justify-content: center;
    transform: rotate(-2.2deg);
    animation: poster-in .9s cubic-bezier(.2, .9, .25, 1.05) both
  }

  @keyframes poster-in {
    from {

  .fedorov-hero-figure {
    position: absolute;
    right: -3vw;
    bottom: 0;
    z-index: 4;
    margin: 0;
    /* 61vw — чтобы на узких десктопах (≈900–1200px) фото не заходило под заголовок */
    height: min(94svh, 1180px, 61vw);
    aspect-ratio: 1400 / 1477;
    pointer-events: none;
    user-select: none;
  }

  .fedorov-hero-depth {
    position: absolute;
    inset: 0;
    transform: translate3d(calc(var(--fed-x, 0) * var(--depth, 0) * 1px), calc(var(--fed-y, 0) * var(--depth, 0) * .55px), 0);
    will-change: transform;
  }

  .fedorov-hero-img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    animation-play-state: paused;
    animation-fill-mode: both;
  }

  .fedorov-hero-figure.is-ready .fedorov-hero-img {
    animation-play-state: running;
  }

  .fedorov-hero-img--back {
    animation: fed-paper-in .85s cubic-bezier(.2, .8, .2, 1) 0s both, fed-paper-float 7s ease-in-out 1.6s infinite alternate;
  }

  /* тень и скотч появляются, когда stop-frame последовательность остановилась на основном кадре */
  .fedorov-hero-img--shadow {
    animation: fed-shadow-in 1.05s cubic-bezier(.2, .8, .2, 1) 1.5s both;
  }

  .fedorov-hero-img--front {
    animation: fed-tape-in .5s cubic-bezier(.34, 1.56, .64, 1) 2.05s both;
  }

  /* ---------- stop-frame: кадры одной фотосессии вклеиваются друг поверх друга ----------
     Все кадры лежат в одной обёртке параллакса (depth 22). Каждый кадр — своя анимация
     одинаковой длины (1.3s, старт .25s) с steps(1,end): значения не плавно перетекают,
     а «щёлкают» кадр за кадром, как в стоп-моушене. Таймеров в JS нет. */
  .fed-frame {
    position: absolute;
    /* кадры лежат точно друг на друге */
    inset: 0;
    transform-origin: 50% 60%;
    visibility: hidden;
    /* промежуточные кадры видны только внутри анимации */
    animation-duration: 1.3s;
    animation-delay: .25s;
    animation-timing-function: steps(1, end);
    animation-fill-mode: both;
  }

  .fed-frame--posed {
    animation-name: fed-seq-posed;
  }

  .fed-frame--print {
    animation-name: fed-seq-print;
  }

  /* основной кадр видим по умолчанию: так он остаётся на месте при reduced-motion и при уходе */
  .fed-frame--laughing {
    visibility: visible;
    animation-name: fed-seq-laughing;
  }

  /* фото-отпечаток (кадр «выглядывает» — с ширмой, поэтому прямоугольный, а не вырезанный) */
  .fedorov-hero-img.fed-print {
    position: absolute;
    right: auto;
    bottom: auto;
    width: 52%;
    height: auto;
    aspect-ratio: 882 / 1062;
    left: 25%;
    top: 12%;
  }

  /* маленький дополнительный кадр, остаётся после последовательности */
  .fedorov-hero-img.fed-mini {
    position: absolute;
    right: auto;
    bottom: auto;
    width: 19%;
    height: auto;
    aspect-ratio: 882 / 1062;
    left: 69%;
    top: 9%;
    transform: rotate(6deg);
    animation: fed-mini-in .5s steps(1, end) 1.95s both;
  }

  @keyframes fed-seq-posed {
    0% {
      visibility: hidden;
      transform: none
    }

    1% {
      visibility: visible;
      transform: translate3d(2%, 3%, 0) rotate(-3deg) scale(1.06)
    }

    7.4% {
      visibility: visible;
      transform: translate3d(.4%, .6%, 0) rotate(-1.4deg) scale(1.01)
    }

    13.8% {
      visibility: visible;
      transform: translate3d(0, 0, 0) rotate(-1deg)
    }

    24% {
      visibility: hidden;
      transform: none
    }

    62% {
      visibility: visible;
      transform: translate3d(-1.6%, .8%, 0) rotate(1.8deg) scale(1.03)
    }

    67% {
      visibility: visible;
      transform: translate3d(-1%, .4%, 0) rotate(1.2deg)
    }

    72%,
    100% {
      visibility: hidden;
      transform: none
    }
  }

  @keyframes fed-seq-print {
    0% {
      visibility: hidden;
      transform: none
    }

    24% {
      visibility: visible;
      transform: translate3d(7%, -3%, 0) rotate(8deg) scale(1.1)
    }

    30.4% {
      visibility: visible;
      transform: translate3d(3%, -1%, 0) rotate(5deg) scale(1.02)
    }

    36.8% {
      visibility: visible;
      transform: translate3d(2.4%, -.6%, 0) rotate(4deg)
    }

    46% {
      visibility: hidden;
      transform: none
    }

    72% {
      visibility: visible;
      transform: translate3d(5%, 4%, 0) rotate(-7deg) scale(1.05)
    }

    77% {
      visibility: visible;
      transform: translate3d(4%, 3.4%, 0) rotate(-6deg)
    }

    80%,
    100% {
      visibility: hidden;
      transform: none
    }
  }

  @keyframes fed-seq-laughing {
    0% {
      visibility: hidden;
      transform: none
    }

    46% {
      visibility: visible;
      transform: translate3d(-2%, 2%, 0) rotate(2.5deg) scale(1.05)
    }

    52.4% {
      visibility: visible;
      transform: translate3d(-.6%, .6%, 0) rotate(1deg)
    }

    62% {
      visibility: hidden;
      transform: none
    }

    80% {
      visibility: visible;
      transform: translate3d(1.6%, 1.6%, 0) rotate(-2.2deg) scale(1.05)
    }

    86.4% {
      visibility: visible;
      transform: translate3d(.5%, .3%, 0) rotate(-.6deg) scale(1.01)
    }

    92.8%,
    100% {
      visibility: visible;
      transform: none
    }
  }

  @keyframes fed-mini-in {
    0% {
      visibility: hidden;
      transform: rotate(6deg)
    }

    1% {
      visibility: visible;
      transform: translate3d(30%, -18%, 0) rotate(20deg) scale(1.45)
    }

    20% {
      visibility: visible;
      transform: translate3d(8%, -4%, 0) rotate(11deg) scale(1.1)
    }

    40%,
    100% {
      visibility: visible;
      transform: rotate(6deg)
    }
  }

  /* повторный приход на главную: последовательность не повторяется,
     основной кадр просто въезжает, как раньше въезжала фигура */
  .fedorov-hero-figure.is-seq-done .fed-frame--posed,
  .fedorov-hero-figure.is-seq-done .fed-frame--print {
    animation: none;
    visibility: hidden;
  }

  .fedorov-hero-figure.is-seq-done .fed-frame--laughing {
    animation: fed-figure-in 1s cubic-bezier(.2, .8, .2, 1) .32s both;
  }

  .fedorov-hero-figure.is-seq-done .fedorov-hero-img--shadow {
    animation-delay: .18s;
  }

  .fedorov-hero-figure.is-seq-done .fedorov-hero-img--front {
    animation-delay: 1.15s;
  }

  .fedorov-hero-figure.is-seq-done .fed-mini {
    animation-delay: 1s;
  }

  /* пока картинки не декодированы — все слои ждут (шорткат animation выше сбрасывает play-state) */
  .fedorov-hero-figure:not(.is-ready) .fedorov-hero-img {
    animation-play-state: paused;
  }

  @keyframes fed-paper-in {
    from {
      transform: translate3d(16%, 7%, 0) rotate(7deg) scale(.9);
      opacity: 0
    }

    to {
      transform: none;
      opacity: 1
    }
  }

  @keyframes fed-shadow-in {
    0% {
      transform: translate3d(42%, 0, 0);
      opacity: 0
    }

    55% {
      opacity: 1
    }

    82% {
      transform: translate3d(-1.4%, 0, 0)

    }

  @keyframes fed-figure-in {

      opacity: 0
    }

      transform: none;
      opacity: 1
    }
  }

  @keyframes fed-tape-in {
    0% {
      transform: scale(1.7) rotate(-10deg);
      opacity: 0
    }

    60% {
      opacity: 1
    }

    100% {
      transform: none;
      opacity: 1
    }
  }

  @keyframes fed-paper-float {
    from {
      transform: translate3d(0, 0, 0) rotate(0)
    }

    to {
      transform: translate3d(0, -1.2%, 0) rotate(-.7deg)
    }
  }

  .fedorov-hero-figure.is-leaving .fedorov-hero-img--front {
    animation: fed-out-right .4s cubic-bezier(.5, 0, .9, .4) 0s both;
  }

  .fedorov-hero-figure.is-leaving .fed-frame--laughing {
    animation: fed-out-right .55s cubic-bezier(.5, 0, .9, .4) .06s both;
  }

  .fedorov-hero-figure.is-leaving .fed-mini {
    animation: fed-out-right .45s cubic-bezier(.5, 0, .9, .4) 0s both;
  }

  .fedorov-hero-figure.is-leaving .fed-frame--posed,
  .fedorov-hero-figure.is-leaving .fed-frame--print {
    animation: none;
    visibility: hidden;
  }

  .fedorov-hero-figure.is-leaving .fedorov-hero-img--shadow {
    animation: fed-out-right .6s cubic-bezier(.5, 0, .9, .4) .14s both;
  }

  .fedorov-hero-figure.is-leaving .fedorov-hero-img--back {
    animation: fed-out-right .6s cubic-bezier(.5, 0, .9, .4) .2s both;
  }

  @keyframes fed-out-right {
    to {
      transform: translate3d(60%, 0, 0) rotate(4deg);
      opacity: 0
    }
  }

  @media (max-width:860px) {

    /* фигура занимает только место под кнопкой: --fed-safe-top измеряет Hero (низ .cta-wrap + отступ).

    }

    }

      function Quiz(p) {
        var q = QUIZ_DATA.questions[p.qi], last = p.qi === TOTAL - 1, M0 = QUIZ_DATA.meta;
        var titleRef = useRef(null), slotRef = useRef(null), first = useRef(true);
        var swept = useRef(p.swept).current;
        useEffect(function () { if (titleRef.current) titleRef.current.focus({ preventScroll: true }); }, []);

        useEffect(function () {
          if (first.current) { first.current = false; return; }
          if (p.sel === null || !slotRef.current) return;
          if (window.matchMedia && matchMedia('(max-width: 860px)').matches) {
            var t = setTimeout(function () {
              var c = slotRef.current && slotRef.current.firstChild;
              if (c && c.scrollIntoView) c.scrollIntoView({ block: 'nearest', behavior: RM ? 'auto' : 'smooth' });
            }, 120);
            return function () { clearTimeout(t); };
          }
        }, [p.sel]);
        var tags = ['А', 'Б', 'В', 'Г'];
        var chosen = p.sel === null ? null : q.answers[p.sel];
        return h('section', { className: 'quiz enter' + (swept ? ' after-sweep' : ''), 'aria-labelledby': 'qt' },
          h(QuizDeco),
          h('div', { className: 'q-left' },
            h(Progress, { n: p.qi + 1 }),
            h('h2', { className: 'q-title', id: 'qt', tabIndex: -1, ref: titleRef }, q.text),
            h(Scene, { k: q.scene })
          ),
          h('div', { className: 'q-right' },
            h('fieldset', { className: 'answers' },
              h('legend', null, q.text),
              q.answers.map(function (a, i) {
                return h('label', { className: 'ans', key: i, style: { '--i': i } },
                  h('input', { type: 'radio', name: 'q' + p.qi, value: i, checked: p.sel === i, onChange: function () { p.onSel(i); } }),
                  h('span', { className: 'card' },
                    h('span', { className: 'tag' }, tags[i]),
                    h('span', { className: 'txt' }, a.hook, h('small', null, a.rest))));
              })
            ),
            h('div', { className: 'music-slot', ref: slotRef, 'aria-live': 'polite' },
              chosen
                ? h(MusicCard, { key: p.sel, music: chosen.music, heading: M0.musicPause.label, listen: M0.musicPause.listen })
                : h('p', { className: 'mc-empty' }, 'После ответа здесь появится музыкальная пауза.'))
          ),
          h('div', { className: 'q-foot' },
            h('button', { className: 'btn ghost small', onClick: p.onBack }, h('span', { className: 'face' }, p.qi === 0 ? '← В начало' : '← Назад')),
            h('button', { className: 'btn', disabled: p.sel === null, onClick: p.onNext }, h('span', { className: 'face', style: { fontSize: 'clamp(16px,1.6vw,24px)' } }, last ? 'Узнать результат' : 'Дальше →'))
          )
        );
      }


      function OrchBlock() {
        var o = QUIZ_DATA.meta.orchestra;
        return h('aside', { className: 'orch-block', 'aria-labelledby': 'orch-t' },
          h('h3', { id: 'orch-t' }, o.title),
          h('p', null, o.text),
          h('div', { className: 'orch-links' },
            o.concerts.url && h('a', { className: 'btn small', href: o.concerts.url, target: '_blank', rel: 'noopener noreferrer' },
              h('span', { className: 'face' }, o.concerts.label, ' ↗')),
            o.links.map(function (l, i) {
              return h('a', { key: i, className: 'orch-link', href: l.url, target: '_blank', rel: 'noopener noreferrer' }, l.label, ' ↗');
            })),
          !o.concerts.url && o.concerts.note && h('p', { className: 'orch-note' }, o.concerts.note));
      }

      function Result(p) {
        var a = QUIZ_DATA.archetypes[p.id], M0 = QUIZ_DATA.meta;
        var words = a.name.split(' '), longest = Math.max.apply(null, words.map(function (w) { return w.length; }));
        var titleRef = useRef(null);
        useEffect(function () { if (titleRef.current) titleRef.current.focus({ preventScroll: true }); }, []);
        var poster = POSTERS[a.poster];
        var archetypeImages = {
          mozart: 'images/archetype_mozart.webp',
          beethoven: 'images/archetype_beethoven.webp',
          tchaikovsky: 'images/archetype_tchaikovsky.webp',
          wagner: 'images/archetype_wagner.webp',
          debussy: 'images/archetype_debussy.webp',
          stravinsky: 'images/archetype_stravinsky.webp',
          fedorov: 'images/archetype_fedorov.webp'
        };
        return h('section', { className: 'result', 'aria-labelledby': 'rt' },
          h(QuizDeco),
          h('div', { className: 'poster-wrap' }, archetypeImages[p.id]
            ? h('img', { className: 'poster archetype-illustration flap-horizontal', src: archetypeImages[p.id], alt: 'Архетип: ' + a.name, loading: 'eager', decoding: 'async' })
            : (poster ? poster() : null)),
          h('div', { className: 'r-copy' },
            h('span', { className: 'r-label rise', style: { '--d': '0.35s' } }, M0.resultLabel),
            h('h2', { className: 'r-name', id: 'rt', tabIndex: -1, ref: titleRef, style: { '--n': longest } },
              words.map(function (w, i) { return h('span', { key: i, className: 'w w' + i + ' rise', style: { '--d': (0.45 + i * 0.12) + 's' } }, w); })),
            a.fullName && a.fullName !== a.name && h('p', { className: 'r-full rise', style: { '--d': '0.6s' } }, a.fullName),
            h('p', { className: 'r-epithet rise', style: { '--d': '0.7s' } }, a.epithet),
            h('p', { className: 'r-text rise', style: { '--d': '0.8s' } }, a.text),
            h('p', { className: 'r-detail rise', style: { '--d': '0.9s' } }, h('b', null, 'Бытовая деталь'), a.detail),
            h('div', { className: 'r-music rise', style: { '--d': '1s' } },
              h(MusicCard, { music: a.music, result: true, heading: M0.resultMusic.label, listen: M0.resultMusic.listen })),
            a.caption && h('p', { className: 'r-note rise', style: { '--d': '1.05s' } }, a.caption),
            h('div', { className: 'rise', style: { '--d': '1.1s', width: '100%' } }, h(OrchBlock)),
            h('div', { className: 'r-actions rise', style: { '--d': '1.15s' } },
              h('button', { className: 'btn', onClick: p.onRetry }, h('span', { className: 'face', style: { fontSize: 'clamp(16px,1.7vw,26px)' } }, M0.retryLabel))
            ),
            h('p', { className: 'r-note small rise', style: { '--d': '1.2s' } }, M0.disclaimer)
          )
        );
      }

      function App() {
        var s = useState('hero'), screen = s[0], setScreen = s[1];
        var qs = useState(0), qi = qs[0], setQi = qs[1];
        var ps = useState(function () { return QUIZ_DATA.questions.map(function () { return null; }); }), picks = ps[0], setPicks = ps[1];
        var rs = useState(null), resId = rs[0], setResId = rs[1];
        var c = useState(false), closed = c[0], setClosed = c[1];
        var pr = useState(false), pressed = pr[0], setPressed = pr[1];
        var sw = useState(false), sweep = sw[0], setSweep = sw[1];
        var busy = useRef(false);


        function curtain(apply, press) {
          if (busy.current) return; busy.current = true;
          if (press) setPressed(true);
          setTimeout(function () { setClosed(true); }, T(press ? 150 : 0));
          setTimeout(function () {
            apply(); setPressed(false);
            requestAnimationFrame(function () { requestAnimationFrame(function () { setClosed(false); }); });
            setTimeout(function () { busy.current = false; }, T(650));
          }, T(press ? 850 : 700));
        }

        function staff(apply) {
          if (busy.current) return; busy.current = true;
          setSweep(true);
          setTimeout(apply, T(480));
          setTimeout(function () { setSweep(false); busy.current = false; }, T(1050));
        }

        function start() { curtain(function () { setScreen('quiz'); setQi(0); }, true); }
        function pick(i) {
          if (busy.current) return;
          setPicks(function (prev) { var n = prev.slice(); n[qi] = i; return n; });
        }
        function next() {
          if (picks[qi] === null) return;
          if (qi < TOTAL - 1) { staff(function () { setQi(qi + 1); }); return; }
          if (!QuizLogic.isComplete(QUIZ_DATA, picks)) return;
          var r = QuizLogic.score(QUIZ_DATA, picks);
          curtain(function () { setResId(r.winner); setScreen('result'); });
        }
        function back() {
          if (qi > 0) staff(function () { setQi(qi - 1); });
          else curtain(function () { setScreen('hero'); });
        }
        function retry() {
          curtain(function () {
            setPicks(QUIZ_DATA.questions.map(function () { return null; }));
            setQi(0); setResId(null); setScreen('hero');
          });
        }

        return h('div', { className: 'app' },
          h(SceneDefs),
          screen === 'hero' && h(Hero, { onStart: start, pressed: pressed }),
          screen === 'quiz' && h(Quiz, { key: qi, qi: qi, sel: picks[qi], swept: sweep, onSel: pick, onNext: next, onBack: back }),
          screen === 'result' && resId && h(Result, { id: resId, onRetry: retry }),
          h(Curtain, { closed: closed }),
          h(Sweep, { on: sweep })
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(App));

    })();
  }
</script>
